{{define "calendar.html"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="3"><title>Demo calendar</title>{{template "style"}}</head>
<body><main><div class="box">
<h1>Demo calendar</h1>
<p class="muted">Events agents created through the demo broker's fake Google Calendar API.</p>
<table><tr><th>Date</th><th>Event</th><th>User</th></tr>
{{range .Events}}<tr><td><code>{{.Start.Date}}</code></td><td><strong>{{.Summary}}</strong><br><span class="muted">{{.Description}}</span></td><td>{{.User}}</td></tr>
{{else}}<tr><td colspan="3" class="muted">No events yet.</td></tr>{{end}}
</table>
</div></main></body></html>{{end}}
